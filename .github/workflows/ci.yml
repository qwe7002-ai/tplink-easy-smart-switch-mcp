name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tplink-easy-smart-switch-mcp-linux
          path: dist/tplink-easy-smart-switch-mcp
          retention-days: 7
