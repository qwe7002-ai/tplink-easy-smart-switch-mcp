name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            script: build
            artifact: tplink-easy-smart-switch-mcp
          - os: windows-latest
            name: windows-x64
            script: build:win
            artifact: tplink-easy-smart-switch-mcp.exe

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: false

      - name: Rename artifacts
        run: |
          mv dist/linux-x64/tplink-easy-smart-switch-mcp dist/tplink-easy-smart-switch-mcp-linux-x64
          mv dist/windows-x64/tplink-easy-smart-switch-mcp.exe dist/tplink-easy-smart-switch-mcp-windows-x64.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tplink-easy-smart-switch-mcp-linux-x64
            dist/tplink-easy-smart-switch-mcp-windows-x64.exe
          generate_release_notes: true
