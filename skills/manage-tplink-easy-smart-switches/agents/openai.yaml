interface:
  display_name: "Manage TP-Link Easy Smart Switches"
  short_description: "Inspect and safely configure Easy Smart switches"
  default_prompt: "Use $manage-tplink-easy-smart-switches to inspect my switch and review its VLAN configuration."

dependencies:
  tools:
    - type: "mcp"
      value: "tplink-easy-smart-switch-mcp"
      description: "Local MCP server for TP-Link and Mercury Easy Smart switch operations"

policy:
  allow_implicit_invocation: true
